# Dependency updates. Action bumps are grouped into one PR per week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # Types must match the Node runtime (Node 22 in the Dockerfiles, CI, and engines).
      # Bump this by hand together with the runtime, not through Dependabot.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
